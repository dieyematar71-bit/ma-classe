<script>

<script>
let K="gestclasse_v2";
const DEF={info:{ecole:"École Dialacoto 1",classe:"CM1",annee:"2026/2027",maitre:"MATAR DIEYE",ia:"TAMBACOUNDA",ief:"TAMBACOUNDA"},
mat:[{n:"Français",p:[{l:"Ressources",m:40},{l:"Compétence",m:60}]},{n:"Mathématiques",p:[{l:"Ressources",m:40},{l:"Compétence",m:60}]},{n:"DM",p:[{l:"Ressources",m:24},{l:"Compétence",m:16}]},{n:"EDD",p:[{l:"Ressources",m:24},{l:"Compétence",m:16}]},{n:"Arabe",p:[{l:"",m:10}]},{n:"Arts plastiques",p:[{l:"",m:10}]}],
el:[],notes:{},abs:{}};
let D;try{D=JSON.parse(localStorage.getItem(K));if(!D){const o=JSON.parse(localStorage.getItem("gestclasse_v1")||"null");D=o?{...DEF,info:o.info,el:o.el,abs:o.abs||{}}:DEF}}catch(e){D=DEF}
const nsx=s=>{s=String(s||"").trim().toUpperCase();return s==="G"?"M":s};
const fixS=()=>(D.el||[]).forEach(e=>{e.s=nsx(e.s)});fixS();
const SUBD={"FRANÇAIS":[["Compréhension",8],["Disciplines outils",32]],"MATHÉMATIQUES":[["Activités numériques",10],["Activités géométriques",10],["Activités de mesure",10],["Résolution de problèmes",10]],"DM":[["Histoire",8],["Géographie",8],["IST",8]],"EDD":[["Vivre dans son milieu",12],["Vivre ensemble",12]]};
const migr=()=>{if(D.sub2)return;D.sub2=1;(D.mat||[]).forEach(m=>{const d=SUBD[String(m.n).toUpperCase()];if(!d)return;m.p.forEach(p=>{if(!p.s&&/^ress/i.test(p.l)&&Math.abs(d.reduce((a,x)=>a+x[1],0)-p.m)<1e-9)p.s=d.map(x=>({l:x[0],m:x[1]}))})})};migr();
const migr3=()=>{if(D.sub3)return;D.sub3=1;const OLD=["vocabulaire","grammaire","conjugaison","orthographe"],NEW="Disciplines outils",isO=l=>OLD.includes(String(l).trim().toLowerCase());(D.mat||[]).forEach(m=>{if(String(m.n).toUpperCase()!=="FRANÇAIS")return;m.p.forEach(p=>{if(!p.s||!p.s.some(q=>isO(q.l)))return;const tot=p.s.filter(q=>isO(q.l)).reduce((a,q)=>a+(+q.m||0),0),out=[];let ins=false;p.s.forEach(q=>{if(isO(q.l)){if(!ins){out.push({l:NEW,m:tot});ins=true}}else out.push(q)});p.s=out;const pre=m.n+"|"+p.l+"|";Object.keys(D.notes||{}).forEach(per=>Object.keys(D.notes[per]||{}).forEach(id=>{const n=D.notes[per][id];let sum=0,any=false;OLD.forEach(o=>Object.keys(n).forEach(k=>{if(k.startsWith(pre)&&isO(k.slice(pre.length))){const v=n[k];if(v!==undefined&&v!==""){sum+=+v;any=true}delete n[k]}}));if(any)n[pre+NEW]=Math.min(tot,sum)}))})});try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};migr3();
const PER=["Composition 1","Composition 2","Composition 3"];
let pgOrd="a",tab="el",per=PER[0],day=new Date().toISOString().slice(0,10),bsel="all";
const $=s=>document.querySelector(s);
let ROLE=null,USER=null;const save=()=>{if(!ROLE)return;try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const TABS=[["el","👥 Élèves"],["pr","✅ Présences"],["no","📝 Notes"],["re","🏆 Résultats"],["tx","📊 Taux de réussite"],["bu","🖨️ Bulletins"],["pg","📋 Passage"],["pa","⚙️ Réglages"]];
const cols=()=>{const a=[];D.mat.forEach(m=>m.p.forEach(p=>a.push({k:m.n+"|"+p.l,n:m.n,l:p.l,m:p.m})));return a};
const g=x=>String(x).replace(".",",");
const ncols=()=>{const a=[];D.mat.forEach(m=>m.p.forEach(p=>{if(p.s&&p.s.length){p.s.forEach(q=>a.push({k:m.n+"|"+p.l+"|"+q.l,n:m.n,l:q.l,m:q.m,pk:m.n+"|"+p.l}));a.push({tot:1,k:m.n+"|"+p.l,n:m.n,l:p.l+" (total)",m:p.m})}else a.push({k:m.n+"|"+p.l,n:m.n,l:p.l,m:p.m})}));return a};
function sm(id,p){const n=(D.notes[p]||{})[id]||{};let s=0,c=0;cols().forEach(x=>{const v=n[x.k];if(v!==undefined&&v!==""){s+=+v;c+=x.m}});return[s,c]}
function moy(id,p){const[s,c]=sm(id,p);return c?s/c*10:null}
function tot(id,p){const[s,c]=sm(id,p);return c?g(s)+" / "+c:"–"}
const f=x=>x==null?"–":x.toFixed(2).replace(".",",");
const app=m=>m==null?"":m>=8?"Très bien":m>=7?"Bien":m>=6?"Assez bien":m>=5?"Passable":"Insuffisant";
function ranks(p){const l=D.el.map(e=>({e,m:moy(e.id,p)})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);const r={};l.forEach((x,i)=>r[x.e.id]=i>0&&x.m===l[i-1].m?r[l[i-1].e.id]:i+1);return r}
const NW=()=>D.nw||{};
const isWD=k=>{const w=new Date(k+"T00:00:00Z").getUTCDay();return w>0&&w<6};
const fd=k=>k.split("-").reverse().join("/");
function wdays(y,m){const n=new Date(Date.UTC(y,m,0)).getUTCDate();let c=0,x=0;for(let d=1;d<=n;d++){const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();if(w>0&&w<6){c++;const k=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");if(NW()[k])x++}}return{c,x}}
function absTot(id){let a=0,r=0;Object.entries(D.abs).forEach(([k,d])=>{if(!isWD(k)||NW()[k])return;if(d[id]==="A")a++;if(d[id]==="R")r++});return{a,r}}
const inf=k=>D.info[k]??({ia:"TAMBACOUNDA",ief:"TAMBACOUNDA"}[k]||"");
const MOIS=[["10","Octobre"],["11","Novembre"],["12","Décembre"],["01","Janvier"],["02","Février"],["03","Mars"],["04","Avril"],["05","Mai"],["06","Juin"]];
function y0(){const m=String(D.info.annee||"").match(/\d{4}/);return m?+m[0]:new Date().getFullYear()}
function mstat(mm){const y=+mm>=10?y0():y0()+1,k=y+"-"+mm;const w=wdays(y,+mm),open=w.c-w.x;const days=Object.keys(D.abs).filter(d=>d.startsWith(k+"-")&&isWD(d)&&!NW()[d]);let a=0;days.forEach(d=>D.el.forEach(e=>{if(!e.ex&&D.abs[d][e.id]==="A")a++}));
const jc=(D.jc||{})[k],has=jc!==undefined&&jc!=="",nj=has?+jc:open,eff=D.el.filter(e=>!e.ex).length,tot=eff*nj;
return{k,y,jc:has?jc:"",days:open,nw:w.x,nj,a,eff,tot,pct:tot?(1-a/tot)*100:null}}
const pc=v=>v==null?"–":v.toFixed(1).replace(".",",")+" %";
const rk=n=>n==null?"–":n===1?"1er":n+"e";
function spl(s){const t=String(s).trim().split(/\s+/);if(t.length<2)return{p:"",n:t[0]||""};const up=t.filter(w=>w.length>1&&w===w.toUpperCase()&&w!==w.toLowerCase());if(up.length&&up.length<t.length)return{p:t.filter(w=>!up.includes(w)).join(" "),n:up.join(" ")};return{p:t.slice(0,-1).join(" "),n:t[t.length-1]}}
const sortEl=()=>{const k=e=>{const w=String(e.nom).trim().split(/\s+/);return[w[1]??w[0],w[0],w.slice(2).join(" ")]};const c=(a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"});return D.el.sort((a,b)=>{const x=k(a),y=k(b);return c(x[0],y[0])||c(x[1],y[1])||c(x[2],y[2])})};
function ann(id){const a=PER.map(p=>moy(id,p));return a.every(x=>x!=null)?a.reduce((s,x)=>s+x,0)/3:null}
function mg(id){const a=ann(id);if(a!=null)return a;const v=PER.map(p=>moy(id,p)).filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
function pgList(){const L=[...D.el];if(pgOrd!=="m")return L;return L.map((e,i)=>{const m=mg(e.id);return{e,i,k:m==null?-1:Math.round(m*100)}}).sort((a,b)=>b.k-a.k||a.i-b.i).map(x=>x.e)}
function annRanks(){const l=D.el.map(e=>({e,m:ann(e.id)})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);const r={};l.forEach((x,i)=>r[x.e.id]=i>0&&x.m===l[i-1].m?r[l[i-1].e.id]:i+1);return r}
const LBL=(n,t3)=>{const u=n.toUpperCase();return u==="FRANÇAIS"?"LANGUE ET COMMUNICATION":u==="DM"?"DECOUVERTE DU MONDE":u==="EDD"?"EDUC. AU DEV. DURABLE":u==="MATHÉMATIQUES"?"MATHEMATIQUES":u==="ARTS PLASTIQUES"?(t3?"EDUC. ARTISTIQUE":"ARTS PLASTIQUES"):u};
const PL=l=>{const s=String(l).toLowerCase();return s.startsWith("ress")?"ress":s.startsWith("comp")?"comp":l};
const mo=m=>m==null?"–":f(m)+"/10";
function bl(e,num,pi,r,ar,eff,onc){const n=(D.notes[PER[pi]]||{})[e.id]||{},m=moy(e.id,PER[pi]),t3=pi===2,nm=spl(e.nom);
const rows=[];D.mat.forEach(x=>x.p.forEach((p,j)=>rows.push({x,p,j})));
const [s]=sm(e.id,PER[pi]);
const disc=rows.map((o,i)=>{const v=n[o.x.n+"|"+o.p.l],one=o.x.p.length===1;
return`<tr>${o.j===0?`<td rowspan="${o.x.p.length}" class="dc">${esc(LBL(o.x.n,t3))}</td>`:""}<td class="${one?"gr":"pl"}">${one?"":esc(PL(o.p.l))}</td><td class="nt">${v!==undefined&&v!==""?g(+v):""}</td><td class="sr">${o.p.m}</td>${i===0?`<td rowspan="${rows.length}" class="ap">${app(m)}</td>`:""}</tr>`}).join("");
const cg=t3?`<table class="cg"><tr><th class="y" colspan="6">CLASSEMENT GENERAL</th></tr><tr><td class="y">MOY. T1</td><td><b>${mo(moy(e.id,PER[0]))}</b></td><td class="y">MOY. T3</td><td><b>${mo(moy(e.id,PER[2]))}</b></td><td class="y" rowspan="2">RANG ANNUEL</td><td rowspan="2"><b>${rk(ar[e.id])}</b></td></tr><tr><td class="y">MOY. T2</td><td><b>${mo(moy(e.id,PER[1]))}</b></td><td class="y">MOY. AN.</td><td><b>${mo(ann(e.id))}</b></td></tr></table>`:"";
return`<div class="bl ${t3?"b3":"b12"}"><table class="hd"><tr><th>IA</th><td colspan="2">${esc(inf("ia"))}</td><th style="width:16%">Année</th><td>${esc(D.info.annee)}</td></tr><tr><th>IEF</th><td colspan="2">${esc(inf("ief"))}</td><td colspan="2" class="nb"></td></tr><tr><th>ECOLE</th><td colspan="2">${esc(D.info.ecole)}</td><th>Titulaire</th><td>${esc(D.info.maitre)}</td></tr></table>
<div class="tt">COMPOSITION DU ${["1e","2e","3e"][pi]} TRIMESTRE</div><div class="bn">BULLETIN DE NOTES</div>
<table><tr><td class="y" rowspan="2" style="width:22%">CLASSE</td><td class="y" rowspan="2" style="width:14%">${esc(D.info.classe)}</td><td rowspan="2" class="nb" style="border-color:transparent"></td><td class="y" style="width:24%;font-size:.85em">EFFECTIF</td><td class="y" style="width:10%">${eff}</td></tr><tr><td class="y" style="font-size:.85em">ONT COMPOSE</td><td class="y">${onc}</td></tr></table>
<table><tr><th class="g" style="width:9%">N°</th><th class="g" style="width:34%">PRENOMS</th><th class="g" style="width:34%">NOM</th><th class="g" style="width:15%">SEXE</th></tr><tr><td><b>${String(num).padStart(2,"0")}</b></td><td><b>${esc(nm.p)}</b></td><td><b>${esc(nm.n)}</b></td><td><b>${esc(e.s||"")}</b></td></tr></table>
<table><tr class="dh"><th>DISCIPLINES</th><th colspan="2">NOTES</th><th>Sur</th><th>APPRECIATION</th></tr>${disc}</table>
<table class="ft"><tr><td class="y">TOTAL</td><td class="v">${g(s)}pts</td><td class="y">MOYENNE</td><td class="v">${mo(m)}</td><td class="y">RANG</td><td class="v">${rk(r[e.id])}</td></tr></table>${cg}
<div class="sg"><div><u>Le maître</u><small>signature</small></div><div><u>Le Directeur</u><small>signature et cachet</small></div><div><u>Le Parent</u><small>signature</small></div></div></div>`}

const pwBlock=()=>`<div class="card" data-free><h2>🔒 Changer mon mot de passe</h2><div class="row"><input id="au_op" type="password" placeholder="Mot de passe actuel" autocomplete="current-password"><input id="au_np" type="password" placeholder="Nouveau (6 car. min.)" autocomplete="new-password"><button class="btn" data-ac="pw_me">Changer</button></div><div class="er" id="au_e1"></div></div>`;
V.pf=()=>{const nM=D.el.filter(e=>e.s==="M").length,nF=D.el.filter(e=>e.s==="F").length,mm=PER.map(p=>{const l=D.el.map(e=>moy(e.id,p)).filter(x=>x!=null);return l.length?l.reduce((a,x)=>a+x,0)/l.length:null});
return`<div class="card"><h2>🏠 Bienvenue, ${esc(USER.nom)}</h2><p class="mu">${esc(D.info.classe)} · ${esc(D.info.ecole)} · ${esc(D.info.annee)}</p><div class="kp"><div><b>${D.el.filter(e=>!e.ex).length}</b>élèves</div><div><b>${nM}</b>garçons</div><div><b>${nF}</b>filles</div>${PER.map((p,i)=>`<div><b>${f(mm[i])}</b>moy. ${esc(p)}</div>`).join("")}</div><p class="mu">Vos données (élèves, présences, notes, bulletins…) sont enregistrées sur cet appareil et visibles de vous seul. Pensez à les sauvegarder régulièrement (onglet ⚙️ Réglages → Exporter).</p></div>`+pwBlock()};
V.adm=()=>{const ms=AUTH.members;return`<div class="card"><h2>👑 Compte administrateur</h2><p>Identifiant : <b>${esc(AUTH.admin.id)}</b> · ${esc(AUTH.admin.nom)}</p></div>`+pwBlock()+
`<div class="card"><h2>➕ Créer un compte membre</h2><div class="row"><input id="au_mn" placeholder="Nom complet"><input id="au_mi" placeholder="Identifiant" autocapitalize="none"><input id="au_mp" placeholder="Mot de passe"><button class="btn s" data-ac="gen">Générer</button><button class="btn" data-ac="add_m">Créer</button></div><div class="er" id="au_e2"></div></div>
<div class="card"><h2>👥 Membres (${ms.length})</h2><div class="sc"><table><tr><th>Nom</th><th>Identifiant</th><th>Statut</th><th>Dernière connexion</th><th></th></tr>${ms.map(m=>{const u=`data-u="${esc(m.id)}"`;return`<tr><td>${esc(m.nom)}</td><td><b>${esc(m.id)}</b></td><td>${m.actif?"✅ Actif":"⛔ Désactivé"}</td><td class="mu">${m.last?new Date(m.last).toLocaleString("fr-FR"):"jamais"}</td><td><button class="btn s" data-ac="pw_m" ${u}>🔑 Mot de passe</button><button class="btn s" data-ac="tg" ${u}>${m.actif?"Désactiver":"Activer"}</button><button class="btn d" data-ac="rm" ${u}>Supprimer</button></td></tr>`}).join("")||`<tr><td colspan="5" class="mu">Aucun membre.</td></tr>`}</table></div></div>
<div class="card"><h2>🚀 Publier pour les membres</h2><p class="mu">Génère une version de l’application contenant uniquement les comptes (identifiants et mots de passe chiffrés), jamais vos données. Chaque membre saisit ses propres données sur son appareil : vous ne les voyez pas, et il ne voit pas les vôtres. Remplacez le fichier sur votre hébergement (GitHub) par ce fichier : tout membre qui ouvre le lien, même sur un nouveau téléphone, arrive directement sur l’écran de connexion, sans pouvoir créer de compte administrateur. À refaire après chaque modification (comptes, notes, présences…).</p><button class="btn" data-ac="pub">Générer le fichier à publier</button><div class="er" id="au_e3"></div></div>
<div class="card"><h2>💾 Sauvegarde complète (données + comptes)</h2><p class="mu">Pour installer l’application sur un autre appareil : exportez ici, puis importez ce fichier en ajoutant #admin à la fin du lien (première utilisation). Les comptes et données sont stockés sur chaque appareil.</p><button class="btn" data-ac="exp_all">Exporter</button><label class="btn s" style="display:inline-block">Importer (remplace tout)<input type="file" id="au_imp" accept=".json" class="hide"></label></div>`};
function lock(){return;const ta=$("#ta");if(ta)ta.closest(".card").remove();
document.querySelectorAll("#v input,#v select,#v textarea,#v button").forEach(x=>{if(x.closest("[data-free]")||["per","bs","day","prt","csv","pgord"].includes(x.id))return;x.disabled=true})}
function render(){if(!tabsFor().some(t=>t[0]===tab))tab=tabsFor()[0][0];nav();$("#v").className=tab==="pg"?"pg":"";$("#v").innerHTML=V[tab]();lock();if(FL){const e=$("#au_e2");if(e){e.className="ok";e.textContent=FL}FL=""}}
const rpw=()=>{const a=new Uint8Array(8),c="abcdefghjkmnpqrstuvwxyz23456789";crypto.getRandomValues(a);return[...a].map(x=>c[x%c.length]).join("")};
document.addEventListener("click",async e=>{const t=e.target.closest("[data-am],[data-ac],#au_go,#au_su,#au_out,#au_dl,#au_dl2");if(!t)return;const id=t.id,ac=t.dataset.ac;
if(t.dataset.am){AM=t.dataset.am;return showAuth()}
if(id==="au_go")return doLogin();if(id==="au_su")return doSetup();if(id==="au_out")return logout();if(id==="au_dl"||id==="au_dl2")return telecharger();
if(ac==="eye"){const i=t.previousElementSibling;i.type=i.type==="password"?"text":"password";return}
if(ac==="close")return $("#md").remove();
if(!ROLE)return;
if(ac==="pw_me"){const e1=$("#au_e1"),o=$("#au_op").value,n=$("#au_np").value;if(await hpw(o,USER.salt)!==USER.h){e1.textContent="Mot de passe actuel incorrect.";return}if(n.length<6){e1.textContent="6 caractères minimum.";return}USER.salt=rsalt();USER.h=await hpw(n,USER.salt);saveAuth();e1.className="ok";e1.textContent="Mot de passe modifié.";$("#au_op").value=$("#au_np").value="";return}
if(ROLE!=="admin")return;
const m=AUTH.members.find(x=>x.id===t.dataset.u);
if(ac==="gen")$("#au_mp").value=rpw();
if(ac==="add_m"){const er=$("#au_e2"),nom=$("#au_mn").value.trim(),mi=$("#au_mi").value.trim().toLowerCase(),p=$("#au_mp").value;
if(!nom||!/^[a-z0-9._-]{3,30}$/.test(mi)){er.textContent="Nom requis. Identifiant : 3 à 30 caractères (lettres, chiffres, . _ -).";return}
if(mi===AUTH.admin.id||AUTH.members.some(x=>x.id===mi)){er.textContent="Cet identifiant existe déjà.";return}
if(p.length<6){er.textContent="Mot de passe : 6 caractères minimum.";return}
const s=rsalt();AUTH.members.push({id:mi,nom,salt:s,h:await hpw(p,s),actif:true,cree:Date.now()});saveAuth();FL="Compte créé — identifiant : "+mi+" · mot de passe : "+p+" (à communiquer au membre).";render()}
if(ac==="pw_m"&&m){const p=prompt("Nouveau mot de passe pour "+m.nom+" (6 caractères min.) :",rpw());if(p===null)return;if(p.length<6)return alert("6 caractères minimum.");m.salt=rsalt();m.h=await hpw(p,m.salt);saveAuth();alert("Mot de passe de "+m.nom+" : "+p)}
if(ac==="tg"&&m){m.actif=!m.actif;saveAuth();render()}
if(ac==="rm"&&m&&confirm("Supprimer le compte de "+m.nom+" ?")){AUTH.members=AUTH.members.filter(x=>x!==m);saveAuth();render()}
if(ac==="pub"){const er=$("#au_e3"),MK1="/*SEE"+"D*/",MK2="/*/SEE"+"D*/";try{const r=await fetch(location.href.split("#")[0],{cache:"no-store"});if(!r.ok)throw 0;let h=await r.text();const a=h.indexOf(MK1),b=h.indexOf(MK2);if(a<0||b<a)throw 0;
const js=JSON.stringify({t:Date.now(),auth:AUTH}).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
h=h.slice(0,a)+MK1+"const SEED="+js+";"+h.slice(b);const fn=location.pathname.split("/").pop()||"index.html";dl2(fn,h,"text/html");er.className="ok";er.textContent="Fichier « "+fn+" » téléchargé : remplacez-le sur votre hébergement."}catch(x){er.className="er";er.textContent="Impossible de générer le fichier : ouvrez l’application depuis son lien en ligne (pas depuis un fichier local)."}}
if(ac==="exp_all")dl2("gestion-classe-sauvegarde-complete.json",JSON.stringify({gc:1,data:D,auth:AUTH}),"application/json")});
document.addEventListener("change",e=>{if(e.target.id!=="au_imp")return;const r=new FileReader();r.onload=()=>{try{const b=JSON.parse(r.result);if(b.gc!==1||!b.auth||!b.auth.admin||!b.data)throw 0;if(AUTH&&!confirm("Remplacer toutes les données et tous les comptes de cet appareil ?"))return;localStorage.setItem(K,JSON.stringify(b.data));localStorage.setItem(AK,JSON.stringify(b.auth));localStorage.setItem("gc_origin","1");localStorage.removeItem(SK);sessionStorage.removeItem(SK);location.reload()}catch(x){alert("Fichier invalide : utilisez une sauvegarde complète (Administration → Exporter).")}};r.readAsText(e.target.files[0])});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&!$("#auth").hidden){const b=$("#au_go")||$("#au_su");b&&b.click()}});
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e});
addEventListener("appinstalled",()=>{DP=null;document.querySelectorAll("#au_dl,#au_dl2").forEach(x=>x.remove())});
if("serviceWorker"in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
(function boot(){let s=null;try{s=JSON.parse(sessionStorage.getItem(SK)||localStorage.getItem(SK)||"null")}catch(e){}
if(AUTH&&s){const u=s.r==="admin"?(AUTH.admin.id===s.u?AUTH.admin:null):AUTH.members.find(x=>x.id===s.u&&x.actif);if(u)return enter(s.r,u,!!localStorage.getItem(SK))}
showAuth()})();
</script></body></html>
