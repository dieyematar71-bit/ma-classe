<!DOCTYPE html>
<html lang="fr"><head>
    
  <style id="claude-scrollbar">@layer claude-scrollbar{*{scrollbar-width:thin}html{scrollbar-color:rgb(128 128 128 / 50%) transparent}}</style><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion de classe</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#d9dde5;--ac:#1b6e4f;--ac2:#e3f3ec;--wa:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d222a;--tx:#e8ebf0;--mu:#9aa3b2;--bd:#323a46;--ac:#4cc592;--ac2:#1f3a30;--wa:#ff8a80}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d222a;--tx:#e8ebf0;--mu:#9aa3b2;--bd:#323a46;--ac:#4cc592;--ac2:#1f3a30;--wa:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 4px}h1{font-size:19px;margin:0}header small{color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:8px 12px 40px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:90px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;margin:4px 4px 0 0}
.btn.s{background:var(--ac2);color:var(--ac)}.btn.d{background:transparent;color:var(--wa);padding:4px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mu);text-transform:uppercase}
td input[type=number]{width:64px}
.st{border:1px solid var(--bd);border-radius:8px;min-width:44px;padding:5px 8px;background:var(--bg);color:var(--tx);cursor:pointer;font:inherit}
.st.A{background:var(--wa);color:#fff;border-color:var(--wa)}.st.R{background:#f5b400;color:#222;border-color:var(--f5b400)}.st.P{background:var(--ac2);color:var(--ac)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kp div{background:var(--ac2);border-radius:10px;padding:10px}.kp b{display:block;font-size:20px;color:var(--ac)}
.low{color:var(--wa);font-weight:600}.mu{color:var(--mu)}
.sheets{display:flex;flex-direction:column;align-items:center;gap:14px}
.sheet{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;width:100%}
.bl{display:block;width:100%;max-width:440px;flex:1 1 340px;border:2px solid #333;background:#fff;color:#000;padding:10px 12px;font:12px/1.2 Calibri,Carlito,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bl.ph{display:none}
.bl>*{margin:0 0 9px}
.bl table{width:100%;border-collapse:collapse;table-layout:auto;display:table}
.bl tr{display:table-row}.bl td,.bl th{display:table-cell}
.bl th,.bl td{border:1px solid #333;padding:2px 4px;text-align:center;font-weight:normal;font-size:1em;color:#000;text-transform:none;white-space:normal;vertical-align:middle}
.bl .hd th{font:bold .9em "Times New Roman",serif;border-color:transparent;text-align:center;width:13%}
.bl .hd td{text-align:left;font-weight:bold;padding:1px 4px}
.bl .hd .nb{border-color:transparent}
.bl .tt{background:#e6e6e6;border:1px solid #333;font-weight:bold;text-align:center;padding:4px;width:70%;margin:0 auto 9px;font-size:1.02em}
.bl .bn{background:#ffff99;border:1px solid #333;font-weight:bold;text-align:center;padding:4px;font-size:1.5em;color:#1a237e}
.bl .y{background:#ffff99;font-weight:bold}
.bl .g{background:#808080;color:#fff;font-weight:bold}
.bl .gr{background:#a6a6a6}
.bl .dh th{background:#ffff99;font-weight:bold}
.bl .dc{font-size:.95em;width:30%}.bl .pl{font-size:.8em;width:9%;text-align:left}
.bl .nt{width:11%;font-weight:bold;height:19px}.bl .sr{width:11%;font-weight:bold}
.bl .ap{font-weight:bold;font-size:1.25em}
.bl .ft td{font-weight:bold;height:28px}
.bl .ft .v{font-size:1.1em}
.bl .sg{display:flex;gap:6px;margin-bottom:0}
.bl .sg>div{flex:1 1 0;border:1px solid #333;height:90px;text-align:center;padding:3px 2px;font-weight:bold;color:#1a237e;line-height:1.15}
.bl .sg u{display:block}.bl .sg small{display:block;font-weight:normal;color:#444;font-size:.75em;text-decoration:none}
.hide{display:none}
@page{size:A4 landscape;margin:0}
@page el_port{size:A4 portrait;margin:0}
.el-print-wrap{display:none}
.el-sheet{background:#fff;color:#000;border:1px solid var(--bd);border-radius:12px;padding:14px;font:12px/1.25 "Times New Roman",Times,serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.el-sheet .el-hdr-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;font-size:12px;line-height:1.4;text-transform:uppercase}
.el-sheet .el-hdr-left{text-align:left}
.el-sheet .el-hdr-right{text-align:left;min-width:210px}
.el-sheet .el-sec-title{font-size:13px;text-transform:uppercase;margin:8px 0 6px;text-align:center}
.el-sheet table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:2px}
.el-sheet th,.el-sheet td{border:1px solid #000;padding:3px 5px;font-size:11px;color:#000;text-transform:none;white-space:normal;word-wrap:break-word;vertical-align:middle;height:23.65pt}
.el-sheet th{font-weight:bold;text-align:left;text-transform:uppercase;background:transparent}
.el-sheet td{text-align:left}
.el-sheet td.c{text-align:center}td.nom-b,td.nom-b b,td.nom-b strong{font-weight:700!important;color:#000!important}.el-sheet td.nom-b,.el-sheet td.nom-b b,.el-sheet td.nom-b strong{font-weight:700!important;color:#000!important}
.el-sheet .el-sigs{display:flex;justify-content:space-around;margin-top:22px;font-weight:bold;font-size:12px;text-transform:uppercase}
.el-sheet .el-sigs span{text-decoration:underline;text-decoration-thickness:1.5px}
@media print{
body.el-printing .card,body.el-printing .sheets,body.el-printing .ps{display:none!important}
body.el-printing main{page:el_port;padding:0;max-width:none;margin:0}
body.el-printing .el-print-wrap{display:block!important}
body.el-printing .el-sheet{border:0;border-radius:0;padding:10mm 12mm}
body.el-printing .el-sheet tr{break-inside:avoid;page-break-inside:avoid}
body.el-printing .el-sheet thead{display:table-header-group}
}
@media print{body{background:#fff}header,nav,.np{display:none!important}main{padding:8mm;max-width:none;margin:0}.card{border:0;padding:0}
.sheets{display:block;margin:-8mm}
.sheet{display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:5mm;width:297mm;height:209mm;position:relative;break-after:page;page-break-after:always;overflow:visible}
.sheet:last-child{break-after:auto;page-break-after:auto}
.sheet::after{content:"";position:absolute;left:148.5mm;top:8mm;bottom:8mm;border-left:2px dashed #000}
.bl,.bl.ph{display:block;flex:none;max-width:none;margin:0;font-size:8pt;line-height:1.15;padding:3mm 4mm;border-width:1.5px;overflow:visible}
.bl.ph{visibility:hidden}
.bl>*{margin-bottom:2.2mm}
.bl.b12{width:125mm;height:148.5mm}
.bl.b3{width:123mm;height:166mm}
.bl .tt{padding:1.2mm;margin-bottom:2.2mm}.bl .bn{padding:1.2mm;font-size:13pt}
.bl .nt{height:5mm}.bl .ft td{height:7.5mm}
.bl td,.bl th{padding:.6mm 1mm}
.bl .hd td,.bl .hd th{padding:.2mm 1mm}
.bl .sg>div{height:19mm}.bl.b3 .sg>div{height:22mm}}

@page dom_land{size:A4 landscape;margin:7mm}
.dom-sheets{display:flex;flex-direction:column;gap:16px}
.dom-sheet{background:#fff;color:#000;border:1px solid var(--bd);border-radius:12px;padding:14px;font:12px/1.25 "Times New Roman",Times,serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.dom-sheet .dom-flag{text-align:center;margin-bottom:3px}
.dom-sheet .dom-flag img{width:25mm;height:10.8mm;display:inline-block}
.dom-sheet .dom-hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;border-bottom:1.5px solid #333;padding-bottom:5px;margin-bottom:6px}
.dom-sheet .dom-left{text-align:left;font-size:11.5px;line-height:1.3}
.dom-sheet .dom-center{text-align:center;align-self:center}
.dom-sheet .dom-center h3{margin:0;font-size:17px;text-transform:uppercase;letter-spacing:.3px}
.dom-sheet .dom-center .dom-sub{font-size:12.5px;font-weight:bold;margin-top:2px}
.dom-sheet .dom-right{text-align:right;font-size:11.5px;line-height:1.3}
.dom-sheet table{width:100%;border-collapse:collapse;margin-bottom:8px}
.dom-sheet th,.dom-sheet td{border:1px solid #333;padding:3px 5px;text-align:center;font-size:11px;color:#000;text-transform:none;white-space:normal;vertical-align:middle}
.dom-sheet th{background:#e6e6e6;font-weight:bold}
.dom-sheet td.l{text-align:left}
.dom-sheet .dom-synth-title{font-weight:bold;text-decoration:underline;font-size:12px;margin:4px 0}
.dom-sheet .dom-synth th{background:#d9d9d9}
.dom-sheet .outil-top{display:grid;grid-template-columns:110px 1fr 110px;align-items:center;gap:8px;margin-bottom:6px}
.dom-sheet .outil-logo{width:34mm;height:auto;display:block}
.dom-sheet .outil-min{font-size:11.5px;line-height:1.3;margin-bottom:6px}
.dom-sheet .outil-min .dl{border-top:1px dotted #333;width:240px;margin:2px 0}
.dom-sheet .outil-banner{text-align:center;font-weight:bold;font-size:14px;margin:6px 0 4px;text-transform:uppercase}
.dom-sheet .outil-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11.5px;margin-bottom:6px;border-bottom:1px solid #333;padding-bottom:4px}
.dom-sheet .outil-synth-hd{background:#d9d9d9;font-weight:bold}
@media print{
main.dom-pg{page:dom_land;padding:0;max-width:none;margin:0}
.dom-sheets{gap:0}
.dom-sheet{border:0;border-radius:0;padding:0;break-after:page;page-break-after:always}
.dom-sheet:last-child{break-after:auto;page-break-after:auto}
.dom-sheet tr{break-inside:avoid;page-break-inside:avoid}
.dom-sheet thead{display:table-header-group}
.dom-sheet .dom-synth{break-inside:avoid;page-break-inside:avoid}
}
@page pg{size:A4 portrait;margin:6mm}
.ps{background:#fff;color:#000;border:1px solid var(--bd);border-radius:12px;padding:14px;font:13px/1.3 "Times New Roman",Times,serif;min-width:780px}
.ps{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ps .hd{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:start;margin-bottom:2px}
.ps .hc{text-align:center;font-weight:bold}
.ps .lg{width:27mm;height:14.7mm;display:block}
.ps .fl{width:27mm;height:11.7mm;display:block;margin:0 auto 2px}
.ps .mn{font-weight:bold;font-size:12px;width:62%;margin-bottom:4px}
.ps .dl{border-top:1px dashed #000;margin:3px 0}
.ps .ys{text-align:right;margin:6px 0}
.ps .ln{display:flex;justify-content:space-between;gap:12px;margin-bottom:4px}
.ps .ln span{flex:1}
.ps .in{width:60%;border:0;border-bottom:1px dotted #000;border-radius:0;background:transparent;color:#000;padding:0 2px;font:inherit}
.ps .tt2{font-weight:bold;font-size:18px;text-decoration:underline;text-align:center;margin:8px auto 10px}
.ps table{width:100%;border-collapse:collapse;margin-bottom:8px}
.ps th,.ps td{border:1px solid #333;padding:3px 4px;text-align:center;font-size:12px;color:#000;text-transform:none;white-space:normal;font-weight:normal;vertical-align:middle}
.ps th{background:#bfbfbf;font-weight:bold}
.ps th.dk{background:#a6a6a6}
.ps .mt tbody tr:nth-child(even) td{background:#d9d9d9}
.ps .rt{text-align:center;font-weight:bold;text-decoration:underline;font-size:14px;margin:10px 0 4px}
.ps td.l{text-align:left}
.ps td input{width:100%;min-width:30px;border:0;border-radius:0;background:transparent;color:#000;text-align:center;padding:1px;font:inherit}
.ps td input:focus{background:#fffbe0}
.ps select{width:100%;min-width:130px;border:1px solid #999;border-radius:4px;background:#fff;color:#000;font:inherit;padding:2px 3px}
.ps select.nb{min-width:0;width:100%;padding:1px 0;border:1px solid #bbb;text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none;cursor:pointer}
.ps select.P{background:#e3f3ec}.ps select.R{background:#fff3c4}.ps select.E{background:#ffe0b2}.ps select.A{background:#fde0dd}
.ps .pt{display:none}
.ps .rc{width:92%;margin:0 auto 8px}
.ps .rc th:first-child,.ps .rc td:first-child{width:18%}
.ps .rc td:first-child{background:#d9d9d9;text-align:center}
.ps .rc th:first-child{background:#fff;border:0}
.ps .sgn{display:flex;justify-content:space-between;gap:8px;margin-top:10px;height:70px;font-weight:bold;text-align:center}
.ps .sgn span{flex:1}
.ps .ft2{text-align:center;font-style:italic;font-size:11px;margin-top:6px}
@media print{
main.pg{page:pg;padding:0}
.ps{border:0;border-radius:0;padding:0;min-width:0;font-size:10pt}
.ps th,.ps td{font-size:8.5pt;padding:1px 2px}
.ps tr{break-inside:avoid;page-break-inside:avoid}
.ps thead{display:table-header-group}
.ps select{display:none}.ps .pt{display:inline}
.ps .in{width:55%}
.ps .rc{break-inside:avoid}.ps .sgn{break-inside:avoid}
}

.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.auth-box h2{margin:0 0 6px;font-size:18px}
.auth-box .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.auth-box label{font-size:13px;font-weight:600;color:var(--mu)}
.auth-box input{width:100%;padding:9px 11px}
.auth-err{color:var(--wa);font-size:13px;font-weight:600;margin:6px 0 10px;min-height:18px}
.auth-ok{color:var(--ac);font-size:13px;font-weight:600;margin:6px 0 10px;min-height:18px}
.hdr-wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hdr-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.role-badge{font-size:12px;font-weight:600;padding:4px 10px;border-radius:14px;background:var(--ac2);color:var(--ac)}
.pw-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}
.pw-form .field{display:flex;flex-direction:column;gap:4px}
.pw-form label{font-size:12px;color:var(--mu);font-weight:600}


/* ---- Onglet Notes : colonne Élève (prénom + nom) et première ligne figées ---- */

.fzt,.fz{position:sticky;background:var(--card)}
.fzt{top:0;z-index:2}
.fz{left:0;z-index:1}

.fzl{box-shadow:2px 0 0 var(--bd)}

<script>
const K="gestclasse_v2";
const DATA_STORE_K="gestclasse_isolated_data_v1";

  {n:"DM",p:[{l:"Ressources",m:24,s:[{l:"Histoire",m:8},{l:"Géographie",m:8},{l:"IST",m:8}]},{l:"Compétence",m:16}]},

  {n:"Arabe",p:[{l:"",m:10}]},
  {n:"Arts plastiques",p:[{l:"",m:10}]}
],
el:[],notes:{},abs:{},sub2:1,sub3:1,fluid4:1,fluid5:1};

const cloneDef=()=>JSON.parse(JSON.stringify(DEF));

const AUTH_K="gestclasse_users_auth_v2", DEF_ADMIN_ID="admin", DEF_ADMIN_PW="admin123";
let curUser=null;
const isAdmin=()=>!!(curUser&&curUser.role==="admin");
const normId=s=>String(s||"").trim().toLowerCase();

function curBucketKey(){
  if(!curUser)return null;
  return curUser.role==="admin"?"admin":"member:"+curUser.id;
}

function loadAllBuckets(){
  try{
    const raw=JSON.parse(localStorage.getItem(DATA_STORE_K)||"null");
    if(raw&&typeof raw==="object")return raw;
  }catch(e){}
  const init={};
  try{
    const legacy=JSON.parse(localStorage.getItem(K)||"null");
    if(legacy&&typeof legacy==="object")init.admin=legacy;
  }catch(e){}
  return init;
}

function saveAllBuckets(buckets){
  try{localStorage.setItem(DATA_STORE_K,JSON.stringify(buckets))}catch(e){}
}

function getBucketData(bucketKey){
  if(!bucketKey)return cloneDef();
  const buckets=loadAllBuckets();
  if(!buckets[bucketKey]){
    buckets[bucketKey]=cloneDef();
    saveAllBuckets(buckets);
  }
  return buckets[bucketKey];
}

function setBucketData(bucketKey,dataObj){
  if(!bucketKey)return;
  const buckets=loadAllBuckets();
  buckets[bucketKey]=dataObj;
  saveAllBuckets(buckets);
}

function deleteBucketData(bucketKey){
  if(!bucketKey||bucketKey==="admin")return;
  const buckets=loadAllBuckets();
  delete buckets[bucketKey];
  saveAllBuckets(buckets);
}

let D=cloneDef();

const nsx=s=>{s=String(s||"").trim().toUpperCase();return s==="G"?"M":s};
const fixS=()=>(D.el||[]).forEach(e=>{e.s=nsx(e.s)});
const SUBD={"FRANÇAIS":[["Compréhension",8],["Disciplines outils",32],["Fluidité",5,1]],"MATHÉMATIQUES":[["Activités numériques",10],["Activités géométriques",10],["Activités de mesure",10],["Résolution de problèmes",10]],"DM":[["Histoire",8],["Géographie",8],["IST",8]],"EDD":[["Vivre dans son milieu",12],["Vivre ensemble",12]]};
const migr=()=>{if(D.sub2)return;D.sub2=1;(D.mat||[]).forEach(m=>{const d=SUBD[String(m.n).toUpperCase()];if(!d)return;m.p.forEach(p=>{if(!p.s&&/^ress/i.test(p.l)&&Math.abs(d.reduce((a,x)=>a+(x[2]?0:x[1]),0)-p.m)<1e-9)p.s=d.map(x=>x[2]?({l:x[0],m:x[1],b:1}):({l:x[0],m:x[1]}))})})};
const migr3=()=>{if(D.sub3)return;D.sub3=1;const OLD=["vocabulaire","grammaire","conjugaison","orthographe"],NEW="Disciplines outils",isO=l=>OLD.includes(String(l).trim().toLowerCase());(D.mat||[]).forEach(m=>{if(String(m.n).toUpperCase()!=="FRANÇAIS")return;m.p.forEach(p=>{if(!p.s||!p.s.some(q=>isO(q.l)))return;const tot=p.s.filter(q=>isO(q.l)).reduce((a,q)=>a+(+q.m||0),0),out=[];let ins=false;p.s.forEach(q=>{if(isO(q.l)){if(!ins){out.push({l:NEW,m:tot});ins=true}}else out.push(q)});p.s=out;const pre=m.n+"|"+p.l+"|";Object.keys(D.notes||{}).forEach(per=>Object.keys(D.notes[per]||{}).forEach(id=>{const n=D.notes[per][id];let sum=0,any=false;OLD.forEach(o=>Object.keys(n).forEach(k=>{if(k.startsWith(pre)&&isO(k.slice(pre.length))){const v=n[k];if(v!==undefined&&v!==""){sum+=+v;any=true}delete n[k]}}));if(any)n[pre+NEW]=Math.min(tot,sum)}))})})};

function ensureFluiditeInFrancais(){
  if(D.fluid5)return;
  D.fluid5=1;D.fluid4=1;
  const normS=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  (D.mat||[]).forEach(m=>{
    if(normS(m.n)!=="francais")return;
    (m.p||[]).forEach(p=>{
      if(!/^ress/i.test(String(p.l||"")))return;
      p.m=40;
      if(!Array.isArray(p.s)||!p.s.length){
        p.s=[{l:"Compréhension",m:8},{l:"Disciplines outils",m:32},{l:"Fluidité",m:5,b:1}];
      }else{
        let fl=p.s.find(q=>normS(q.l)==="fluidite");
        if(!fl){fl={l:"Fluidité",m:5};p.s.push(fl)}
        fl.b=1;if(!(+fl.m>0))fl.m=5;
        const ou=p.s.find(q=>normS(q.l)==="disciplines outils");
        if(ou){const autres=p.s.filter(q=>q!==ou&&!q.b).reduce((a,q)=>a+(+q.m||0),0);ou.m=Math.max(0,40-autres)}
      }
      const pre=m.n+"|"+p.l;
      Object.keys(D.notes||{}).forEach(per=>Object.keys(D.notes[per]||{}).forEach(id=>{
        const n=D.notes[per][id];
        const vs=p.s.map(q=>n[pre+"|"+q.l]).filter(z=>z!==undefined&&z!=="");
        if(vs.length)n[pre]=Math.min(p.m,vs.reduce((a,z)=>a+(+z),0));
      }));
    });
  });
}

function ensureDefaultSubdisciplines(){
  const normKey=s=>String(s||"").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const MAP={"FRANCAIS":"FRANÇAIS","MATHEMATIQUES":"MATHÉMATIQUES","DM":"DM","EDD":"EDD"};
  (D.mat||[]).forEach(m=>{
    const k=MAP[normKey(m.n)];
    const defs=k?SUBD[k]:null;
    if(!defs||!Array.isArray(m.p))return;
    m.p.forEach(p=>{
      if((!Array.isArray(p.s)||!p.s.length)&&/^ress/i.test(String(p.l||""))){
        const tot=defs.reduce((acc,x)=>acc+(x[2]?0:(+x[1]||0)),0);
        if(Math.abs(tot-(+p.m||0))<1e-9||!p.m){
          p.s=defs.map(x=>x[2]?({l:x[0],m:x[1],b:1}):({l:x[0],m:x[1]}));
          p.m=tot;
        }
      }
    });
  });
}

function normalizeCurrentDataset(){
  if(!D.info)D.info=cloneDef().info;
  if(!Array.isArray(D.mat)||!D.mat.length)D.mat=cloneDef().mat;
  if(!Array.isArray(D.el))D.el=[];
  if(!D.notes||typeof D.notes!=="object")D.notes={};
  if(!D.abs||typeof D.abs!=="object")D.abs={};
  fixS();
  migr();
  migr3();
  ensureDefaultSubdisciplines();
  ensureFluiditeInFrancais();
  sortEl();
}

function loadActiveUserData(){
  const bk=curBucketKey();
  if(!bk){
    D=cloneDef();
    return;
  }
  D=getBucketData(bk);
  normalizeCurrentDataset();
  setBucketData(bk,D);
}

const PER=["Composition 1","Composition 2","Composition 3","Prétest","Post-test"];
const isTestPer=p=>p==="Prétest"||p==="Post-test";
let pgOrd="a",tab="el",per=PER[0],day=new Date().toISOString().slice(0,10),bsel="all";
const $=s=>document.querySelector(s);
const save=()=>{const bk=curBucketKey();if(!bk)return;setBucketData(bk,D)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const TABS=[["el","👥 Élèves"],["pr","✅ Présences"],["no","📝 Notes"],["re","🏆 Résultats"],["tx","📊 Taux de réussite"],["dm","📄 Feuilles domaines"],["bu","🖨️ Bulletins"],["pg","📋 Passage"],["pa","⚙️ Réglages"]];
const cols=()=>{const a=[];D.mat.forEach(m=>m.p.forEach(p=>a.push({k:m.n+"|"+p.l,n:m.n,l:p.l,m:p.m})));return a};
const g=x=>String(x).replace(".",",");
const ncols=()=>{const a=[];D.mat.forEach(m=>m.p.forEach(p=>{if(p.s&&p.s.length){p.s.forEach(q=>a.push({k:m.n+"|"+p.l+"|"+q.l,n:m.n,l:q.l,m:q.m,b:q.b?1:0,pk:m.n+"|"+p.l}));a.push({tot:1,k:m.n+"|"+p.l,n:m.n,l:p.l+" (total)",m:p.m})}else a.push({k:m.n+"|"+p.l,n:m.n,l:p.l,m:p.m})}));return a};
function sm(id,p){const n=(D.notes[p]||{})[id]||{};let s=0,c=0;cols().forEach(x=>{const v=n[x.k];if(v!==undefined&&v!==""){s+=+v;c+=x.m}});return[s,c]}
function moy(id,p){const[s,c]=sm(id,p);return c?s/c*10:null}
function tot(id,p){const[s,c]=sm(id,p);return c?g(s)+" / "+c:"–"}
const f=x=>x==null?"–":x.toFixed(2).replace(".",",");
const app=m=>m==null?"":m>=8?"Très bien":m>=7?"Bien":m>=6?"Assez bien":m>=5?"Passable":"Insuffisant";
function ranks(p){const l=D.el.map(e=>({e,m:moy(e.id,p)})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);const r={};l.forEach((x,i)=>r[x.e.id]=i>0&&x.m===l[i-1].m?r[l[i-1].e.id]:i+1);return r}
const NW=()=>D.nw||{};
const isWD=k=>{const w=new Date(k+"T00:00:00Z").getUTCDay();return w>0&&w<6};
const fd=k=>k.split("-").reverse().join("/");
function wdays(y,m){const n=new Date(Date.UTC(y,m,0)).getUTCDate();let c=0,x=0;for(let d=1;d<=n;d++){const w=new Date(Date.UTC(y,m-1,d)).getUTCDay();if(w>0&&w<6){c++;const k=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");if(NW()[k])x++}}return{c,x}}
function absTot(id){let a=0,r=0;Object.entries(D.abs).forEach(([k,d])=>{if(!isWD(k)||NW()[k])return;if(d[id]==="A")a++;if(d[id]==="R")r++});return{a,r}}
const inf=k=>D.info[k]??({ia:"TAMBACOUNDA",ief:"TAMBACOUNDA"}[k]||"");
const MOIS=[["10","Octobre"],["11","Novembre"],["12","Décembre"],["01","Janvier"],["02","Février"],["03","Mars"],["04","Avril"],["05","Mai"],["06","Juin"]];
function y0(){const m=String(D.info.annee||"").match(/\d{4}/);return m?+m[0]:new Date().getFullYear()}
function mstat(mm){const y=+mm>=10?y0():y0()+1,k=y+"-"+mm;const w=wdays(y,+mm),open=w.c-w.x;const days=Object.keys(D.abs).filter(d=>d.startsWith(k+"-")&&isWD(d)&&!NW()[d]);let a=0;days.forEach(d=>D.el.forEach(e=>{if(!e.ex&&D.abs[d][e.id]==="A")a++}));
const jc=(D.jc||{})[k],has=jc!==undefined&&jc!=="",nj=has?+jc:open,eff=D.el.filter(e=>!e.ex).length,tot=eff*nj;
return{k,y,jc:has?jc:"",days:open,nw:w.x,nj,a,eff,tot,pct:tot?(1-a/tot)*100:null}}
const pc=v=>v==null?"–":v.toFixed(1).replace(".",",")+" %";
const rk=n=>n==null?"–":n===1?"1er":n+"e";
function spl(s){const t=String(s).trim().split(/\s+/);if(t.length<2)return{p:"",n:t[0]||""};const up=t.filter(w=>w.length>1&&w===w.toUpperCase()&&w!==w.toLowerCase());if(up.length&&up.length<t.length)return{p:t.filter(w=>!up.includes(w)).join(" "),n:up.join(" ")};return{p:t.slice(0,-1).join(" "),n:t[t.length-1]}}
const sortEl=()=>{const c=(a,b)=>a.localeCompare(b,"fr",{sensitivity:"base"});return D.el.sort((a,b)=>c(splitPrenomNom3(a.nom).n,splitPrenomNom3(b.nom).n))};
function ann(id){const trimPers=["Composition 1","Composition 2","Composition 3"];const a=trimPers.map(p=>moy(id,p));return a.every(x=>x!=null)?a.reduce((s,x)=>s+x,0)/3:null}
function mg(id){const a=ann(id);if(a!=null)return a;const trimPers=["Composition 1","Composition 2","Composition 3"];const v=trimPers.map(p=>moy(id,p)).filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
function pgList(){const L=[...D.el];if(pgOrd!=="m")return L;return L.map((e,i)=>{const m=mg(e.id);return{e,i,k:m==null?-1:Math.round(m*100)}}).sort((a,b)=>b.k-a.k||a.i-b.i).map(x=>x.e)}
function annRanks(){const l=D.el.map(e=>({e,m:ann(e.id)})).filter(x=>x.m!=null).sort((a,b)=>b.m-a.m);const r={};l.forEach((x,i)=>r[x.e.id]=i>0&&x.m===l[i-1].m?r[l[i-1].e.id]:i+1);return r}
const LBL=(n,t3)=>{const u=n.toUpperCase();return u==="FRANÇAIS"?"LANGUE ET COMMUNICATION":u==="DM"?"DECOUVERTE DU MONDE":u==="EDD"?"EDUC. AU DEV. DURABLE":u==="MATHÉMATIQUES"?"MATHEMATIQUES":u==="ARTS PLASTIQUES"?(t3?"EDUC. ARTISTIQUE":"ARTS PLASTIQUES"):u};
const PL=l=>{const s=String(l).toLowerCase();return s.startsWith("ress")?"ress":s.startsWith("comp")?"comp":l};
const mo=m=>m==null?"–":f(m)+"/10";
function bl(e,num,pi,r,ar,eff,onc){const n=(D.notes[PER[pi]]||{})[e.id]||{},m=moy(e.id,PER[pi]),t3=pi===2,nm=spl(e.nom);
const rows=[];D.mat.forEach(x=>x.p.forEach((p,j)=>rows.push({x,p,j})));
const [s]=sm(e.id,PER[pi]);
const disc=rows.map((o,i)=>{const v=n[o.x.n+"|"+o.p.l],one=o.x.p.length===1;
return`<tr>${o.j===0?`<td rowspan="${o.x.p.length}" class="dc">${esc(LBL(o.x.n,t3))}</td>`:""}<td class="${one?"gr":"pl"}">${one?"":esc(PL(o.p.l))}</td><td class="nt">${v!==undefined&&v!==""?g(+v):""}</td><td class="sr">${o.p.m}</td>${i===0?`<td rowspan="${rows.length}" class="ap">${app(m)}</td>`:""}</tr>`}).join("");
const cg=t3?`<table class="cg"><tr><th class="y" colspan="6">CLASSEMENT GENERAL</th></tr><tr><td class="y">MOY. T1</td><td><b>${mo(moy(e.id,PER[0]))}</b></td><td class="y">MOY. T3</td><td><b>${mo(moy(e.id,PER[2]))}</b></td><td class="y" rowspan="2">RANG ANNUEL</td><td rowspan="2"><b>${rk(ar[e.id])}</b></td></tr><tr><td class="y">MOY. T2</td><td><b>${mo(moy(e.id,PER[1]))}</b></td><td class="y">MOY. AN.</td><td><b>${mo(ann(e.id))}</b></td></tr></table>`:"";
return`<div class="bl ${t3?"b3":"b12"}"><table class="hd"><tr><th>IA</th><td colspan="2">${esc(inf("ia"))}</td><th style="width:16%">Année</th><td>${esc(D.info.annee)}</td></tr><tr><th>IEF</th><td colspan="2">${esc(inf("ief"))}</td><td colspan="2" class="nb"></td></tr><tr><th>ECOLE</th><td colspan="2">${esc(D.info.ecole)}</td><th>Titulaire</th><td>${esc(D.info.maitre)}</td></tr></table>
<div class="tt">COMPOSITION DU ${["1e","2e","3e"][pi]} TRIMESTRE</div><div class="bn">BULLETIN DE NOTES</div>
<table><tr><td class="y" rowspan="2" style="width:22%">CLASSE</td><td class="y" rowspan="2" style="width:14%">${esc(D.info.classe)}</td><td rowspan="2" class="nb" style="border-color:transparent"></td><td class="y" style="width:24%;font-size:.85em">EFFECTIF</td><td class="y" style="width:10%">${eff}</td></tr><tr><td class="y" style="font-size:.85em">ONT COMPOSE</td><td class="y">${onc}</td></tr></table>
<table><tr><th class="g" style="width:9%">N°</th><th class="g" style="width:34%">PRENOMS</th><th class="g" style="width:34%">NOM</th><th class="g" style="width:15%">SEXE</th></tr><tr><td><b>${String(num).padStart(2,"0")}</b></td><td><b>${esc(nm.p)}</b></td><td><b>${esc(nm.n)}</b></td><td><b>${esc(e.s||"")}</b></td></tr></table>
<table><tr class="dh"><th>DISCIPLINES</th><th colspan="2">NOTES</th><th>Sur</th><th>APPRECIATION</th></tr>${disc}</table>
<table class="ft"><tr><td class="y">TOTAL</td><td class="v">${g(s)}pts</td><td class="y">MOYENNE</td><td class="v">${mo(m)}</td><td class="y">RANG</td><td class="v">${rk(r[e.id])}</td></tr></table>${cg}
<div class="sg"><div><u>Le maître</u><small>signature</small></div><div><u>Le Directeur</u><small>signature et cachet</small></div><div><u>Le Parent</u><small>signature</small></div></div></div>`}
function nav(){
  if(!curUser){$("#nav").innerHTML="";$("#sub").textContent="";return}
  $("#nav").innerHTML=TABS.map(t=>`<button class="${t[0]===tab?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("");
  const who=isAdmin()?"Espace Administrateur":`Espace Membre (${curUser.name})`;
  $("#sub").textContent=`${who} · ${D.info.classe} · ${D.info.ecole} · ${D.info.annee} · ${D.el.length} élèves`;
}
function perSel(){return`<select id="per">${PER.map(p=>`<option ${p===per?"selected":""}>${p}</option>`).join("")}</select>`}

      document.querySelectorAll("#v .sc").forEach(sc=>{

async function sha256Hex(str){
  if(window.crypto&&window.crypto.subtle){
    const buf=await window.crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
  return (h>>>0).toString(16).padStart(8,"0");
}

function loadUsersRaw(){
  try{return JSON.parse(localStorage.getItem(AUTH_K)||"null")}catch(e){return null}
}
function saveUsersRaw(st){
  try{localStorage.setItem(AUTH_K,JSON.stringify(st))}catch(e){}
}

async function ensureUsers(){
  let st=loadUsersRaw();
  if(!st||!st.admin||!st.admin.hash||!st.admin.salt||!st.admin.login){
    const salt=Math.random().toString(36).slice(2,12);
    const hash=await sha256Hex(salt+":"+DEF_ADMIN_PW);
    st={admin:{login:DEF_ADMIN_ID,salt,hash,updatedAt:new Date().toISOString()},members:Array.isArray(st?.members)?st.members:[]};
    saveUsersRaw(st);
  }
  if(!Array.isArray(st.members)){st.members=[];saveUsersRaw(st)}
  return st;
}

async function authenticate(login,pw){
  const st=await ensureUsers();
  const lid=normId(login), p=String(pw||"");
  if(!lid||!p)return null;
  if(normId(st.admin.login)===lid){
    const h=await sha256Hex(st.admin.salt+":"+p);
    if(h===st.admin.hash)return{role:"admin",login:st.admin.login,name:"Administrateur"};
    return null;
  }
  for(const m of st.members){
    if(normId(m.login)===lid){
      const h=await sha256Hex(m.salt+":"+p);
      if(h===m.hash)return{role:"member",id:m.id,login:m.login,name:m.name||m.login,canEditCreds:!!m.canEditCreds};
      return null;
    }
  }
  return null;
}

document.addEventListener("submit",async e=>{
  const fid=e.target&&e.target.id;
  if(fid==="loginForm"){
    e.preventDefault();
    const err=$("#loginErr");
    const u=await authenticate($("#loginId").value,$("#loginPw").value);
    if(u){
      curUser=u;
      tab="el";
      per=PER[0];
      bsel="all";
      pgOrd="a";
      loadActiveUserData();
      if(err)err.textContent="";
      syncAuthUI();
      render();
    }else{
      if(err)err.textContent="Identifiant ou mot de passe incorrect.";
      $("#loginPw").select();
    }
  }
  if(fid==="addMemberForm"){
    e.preventDefault();
    const msg=$("#memMsg"),err=$("#memErr");
    msg.textContent="";err.textContent="";
    if(!isAdmin()){err.textContent="Action réservée à l’administrateur.";return}
    const st=await ensureUsers();
    const name=$("#memName").value.trim();
    const login=$("#memLogin").value.trim();
    const pw=$("#memPw").value;
    if(!login||pw.length<4){err.textContent="Identifiant requis et mot de passe de 4 caractères minimum.";return}
    const lid=normId(login);
    if(normId(st.admin.login)===lid||st.members.some(m=>normId(m.login)===lid)){
      err.textContent="Cet identifiant est déjà utilisé.";return;
    }
    const salt=Math.random().toString(36).slice(2,12);
    const hash=await sha256Hex(salt+":"+pw);
    const newId=uid();
    st.members.push({id:newId,name:name||login,login,salt,hash,canEditCreds:false,createdAt:new Date().toISOString()});
    saveUsersRaw(st);
    setBucketData("member:"+newId,cloneDef());
    e.target.reset();
    render();
    const m2=$("#memMsg");if(m2)m2.textContent=`Membre « ${login} » ajouté avec son propre espace de données isolé.`;
  }
  if(fid==="adminCredForm"){
    e.preventDefault();
    const msg=$("#admMsg"),err=$("#admErr");
    msg.textContent="";err.textContent="";
    if(!isAdmin()){err.textContent="Action réservée à l’administrateur.";return}
    const st=await ensureUsers();
    const cur=$("#admCurPw").value;
    const newLogin=$("#admNewLogin").value.trim();
    const newPw=$("#admNewPw").value;
    const confPw=$("#admConfPw").value;
    if((await sha256Hex(st.admin.salt+":"+cur))!==st.admin.hash){err.textContent="Mot de passe actuel incorrect.";return}
    if(!newLogin){err.textContent="L’identifiant ne peut pas être vide.";return}
    if(st.members.some(m=>normId(m.login)===normId(newLogin))){err.textContent="Cet identifiant appartient déjà à un membre.";return}
    if(newPw){
      if(newPw.length<4){err.textContent="Le nouveau mot de passe doit contenir au moins 4 caractères.";return}
      if(newPw!==confPw){err.textContent="La confirmation du mot de passe ne correspond pas.";return}
      const salt=Math.random().toString(36).slice(2,12);
      st.admin.salt=salt;
      st.admin.hash=await sha256Hex(salt+":"+newPw);
    }
    st.admin.login=newLogin;
    st.admin.updatedAt=new Date().toISOString();
    saveUsersRaw(st);
    curUser.login=newLogin;
    syncAuthUI();
    e.target.reset();
    $("#admNewLogin").value=newLogin;
    msg.textContent="Accès administrateur mis à jour.";
  }
  if(fid==="memberSelfForm"){
    e.preventDefault();
    const msg=$("#mSelfMsg"),err=$("#mSelfErr");
    msg.textContent="";err.textContent="";
    if(!curUser||isAdmin())return;
    const st=await ensureUsers();
    const m=st.members.find(x=>x.id===curUser.id);
    if(!m||!m.canEditCreds){err.textContent="Vous n’avez pas l’autorisation de l’administrateur pour modifier vos accès.";return}
    const cur=$("#mCurPw").value;
    const newId=$("#mNewId").value.trim();
    const newPw=$("#mNewPw").value;
    if((await sha256Hex(m.salt+":"+cur))!==m.hash){err.textContent="Mot de passe actuel incorrect.";return}
    if(!newId){err.textContent="Identifiant invalide.";return}
    const lid=normId(newId);
    if(normId(st.admin.login)===lid||st.members.some(x=>x.id!==m.id&&normId(x.login)===lid)){
      err.textContent="Cet identifiant est déjà utilisé.";return;
    }
    if(newPw){
      if(newPw.length<4){err.textContent="Le mot de passe doit contenir au moins 4 caractères.";return}
      const salt=Math.random().toString(36).slice(2,12);
      m.salt=salt;
      m.hash=await sha256Hex(salt+":"+newPw);
    }
    m.login=newId;
    saveUsersRaw(st);
    curUser.login=newId;
    syncAuthUI();
    render();
    const m2=$("#mSelfMsg");if(m2)m2.textContent="Vos identifiants ont été mis à jour.";
  }
});

document.addEventListener("change",async e=>{
  const t=e.target;
  if(t&&t.dataset.mperm){
    if(!isAdmin()){t.checked=!t.checked;return}

document.addEventListener("click",async e=>{
  const t=e.target;
  if(t&&t.id==="lockBtn"){
    save();
    curUser=null;
    D=cloneDef();
    syncAuthUI();
    render();
    return;
  }
  if(t&&t.dataset.mdel){
    if(!isAdmin())return;
    const st=await ensureUsers();
    const m=st.members.find(x=>x.id===t.dataset.mdel);
    if(m&&confirm(`Supprimer le membre « ${m.login} » et effacer ses données isolées ?`)){
      st.members=st.members.filter(x=>x.id!==m.id);
      saveUsersRaw(st);
      deleteBucketData("member:"+m.id);
      render();
    }
    return;
  }
  if(t&&t.dataset.medit){
    if(!isAdmin())return;
    const st=await ensureUsers();
    const m=st.members.find(x=>x.id===t.dataset.medit);
    if(!m)return;
    const newLogin=prompt("Nouvel identifiant pour ce membre :",m.login);
    if(newLogin===null)return;
    const clean=newLogin.trim();
    if(!clean){alert("Identifiant invalide.");return}
    const lid=normId(clean);
    if(normId(st.admin.login)===lid||st.members.some(x=>x.id!==m.id&&normId(x.login)===lid)){
      alert("Cet identifiant est déjà utilisé.");return;
    }
    const newPw=prompt("Nouveau mot de passe (4 caractères min. — laisser vide pour conserver l’actuel) :","");
    if(newPw===null)return;
    if(newPw){
      if(newPw.length<4){alert("Mot de passe trop court (4 caractères minimum).");return}
      const salt=Math.random().toString(36).slice(2,12);
      m.salt=salt;
      m.hash=await sha256Hex(salt+":"+newPw);
    }
    m.login=clean;
    saveUsersRaw(st);
    render();
    return;
  }
});

ensureUsers().then(()=>{
  D=cloneDef();
  syncAuthUI();
  render();
});
</script>

  let deferredPwaPrompt = null;

  function buildManifestDataUrl(){
    const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#1b6e4f"/><text x="96" y="120" text-anchor="middle" font-size="90" font-family="system-ui,sans-serif" fill="#ffffff">📚</text></svg>`;
    const iconUri = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIcon);
    const manifestObj = {
      name: "Gestion de classe",
      short_name: "Gestion classe",
      description: "Application de gestion de classe — Administrateur et Membre",
      start_url: window.location.href,
      scope: "./",
      display: "standalone",
      background_color: "#f6f7f9",
      theme_color: "#1b6e4f",
      icons: [
        { src: iconUri, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
        { src: iconUri, sizes: "512x512", type: "image/svg+xml", purpose: "any" }
      ]
    };
    return "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifestObj));
  }

  function ensureAppManifest(){
    let link = document.querySelector('link[rel="manifest"]');
    if(!link){
      link = document.createElement("link");
      link.rel = "manifest";
      document.head.appendChild(link);
    }
    link.href = buildManifestDataUrl();

    if(!document.querySelector('meta[name="theme-color"]')){
      const m = document.createElement("meta");
      m.name = "theme-color";
      m.content = "#1b6e4f";
      document.head.appendChild(m);
    }
    if(!document.querySelector('meta[name="mobile-web-app-capable"]')){
      const mwa = document.createElement("meta");
      mwa.name = "mobile-web-app-capable";
      mwa.content = "yes";
      document.head.appendChild(mwa);
    }
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPwaPrompt = e;
    refreshShortcutButtons();
  });

  window.addEventListener("appinstalled", function(){
    deferredPwaPrompt = null;
    refreshShortcutButtons();
    setShortcutStatus("✅ L’application a été installée sur votre appareil.");
  });

  function setShortcutStatus(msg){
    ["#installHelpMsg", "#authInstallMsg", "#shortcutBannerMsg"].forEach(function(sel){
      const el = document.querySelector(sel);
      if(el) el.textContent = msg;
    });
  }

  function triggerBlobDownload(filename, content, mimeType){
    const blob = new Blob([content], { type: mimeType || "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  function createDesktopUrlShortcut(){
    const targetUrl = window.location.href;
    const urlFileContent = "[InternetShortcut]\r\nURL=" + targetUrl + "\r\nIDList=\r\nHotKey=0\r\nIconIndex=0\r\n";
    triggerBlobDownload("Gestion de classe.url", urlFileContent, "application/internet-shortcut");
  }

  function exportCleanAppHtml(){
    const clone = document.documentElement.cloneNode(true);
    const mLink = clone.querySelector('link[rel="manifest"]');
    if(mLink){
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="36" fill="#1b6e4f"/><text x="96" y="120" text-anchor="middle" font-size="90" font-family="system-ui,sans-serif" fill="#ffffff">📚</text></svg>`;
      const iconUri = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIcon);
      mLink.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify({
        name: "Gestion de classe",
        short_name: "Gestion classe",
        description: "Application de gestion de classe — Administrateur et Membre",
        start_url: "./",
        scope: "./",
        display: "standalone",
        background_color: "#f6f7f9",
        theme_color: "#1b6e4f",
        icons: [
          { src: iconUri, sizes: "192x192", type: "image/svg+xml", purpose: "any" },
          { src: iconUri, sizes: "512x512", type: "image/svg+xml", purpose: "any" }
        ]
      }));
    }
    const gate = clone.querySelector("#authGate");
    if(gate) gate.style.display = "flex";
    const installWrap = clone.querySelector("#authInstallWrap");
    if(installWrap) installWrap.style.display = "block";
    const lid = clone.querySelector("#loginId");
    if(lid) lid.value = "";
    const lpw = clone.querySelector("#loginPw");
    if(lpw) lpw.value = "";
    const badge = clone.querySelector("#whoBadge");
    if(badge) badge.textContent = "";
    const nav = clone.querySelector("#nav");
    if(nav) nav.innerHTML = "";
    const sub = clone.querySelector("#sub");
    if(sub) sub.textContent = "";
    const v = clone.querySelector("#v");
    if(v) v.innerHTML = "";

    const htmlOut = "<!DOCTYPE html>\n" + clone.outerHTML;
    triggerBlobDownload("Ma_Classe_Application-v9.html", htmlOut, "text/html;charset=utf-8");
  }

  async function forceInstallOrDesktopShortcut(){
    ensureAppManifest();
    let pwaAccepted = false;

    if(deferredPwaPrompt){
      try{
        await deferredPwaPrompt.prompt();
        const res = await deferredPwaPrompt.userChoice;
        deferredPwaPrompt = null;
        refreshShortcutButtons();
        if(res && res.outcome === "accepted"){
          pwaAccepted = true;
        }
      }catch(err){
        deferredPwaPrompt = null;
      }
    }

    createDesktopUrlShortcut();

    if(pwaAccepted){
      setShortcutStatus("✅ Installation lancée et fichier raccourci « Gestion de classe.url » généré. Déplacez « Gestion de classe.url » sur votre Bureau si besoin.");
    }else if(window.location.protocol === "file:"){
      setShortcutStatus("📌 Raccourci « Gestion de classe.url » téléchargé (déplacez-le sur le Bureau). Note : les navigateurs bloquent l’installation automatique d’application en mode fichier local (file://) ; vous pouvez aussi enregistrer/déplacer le fichier HTML directement sur le Bureau.");
    }else{
      setShortcutStatus("📌 Raccourci « Gestion de classe.url » téléchargé (déplacez-le sur le Bureau). Si le navigateur n’affiche pas la fenêtre d’installation automatique, ouvrez le menu du navigateur (⋮) → « Cast, enregistrer et partager » / « Installer la page comme application » / « Créer un raccourci ».");
    }
  }

  function isAppStandalone(){
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  function refreshShortcutButtons(){
    document.querySelectorAll("[data-desktop-shortcut]").forEach(function(btn){
      if(isAppStandalone()){
        btn.innerHTML = SHORTCUT_ICON_SVG + " Raccourci Bureau (Actif)";
      }else if(deferredPwaPrompt){
        btn.innerHTML = SHORTCUT_ICON_SVG + " Installer / Raccourci Bureau";
      }else{
        btn.innerHTML = SHORTCUT_ICON_SVG + " Raccourci Bureau";
      }
    });
  }

  function mountShortcutControls(){
    ensureAppManifest();
    const isLoggedIn = typeof curUser !== "undefined" && !!curUser;

    document.querySelectorAll("header [data-desktop-shortcut], header [data-export-app-html], #desktopAppCard").forEach(function(el){
      el.remove();
    });

    const loginForm = document.querySelector("#loginForm");
    let wrap = document.querySelector("#authInstallWrap");
    if(loginForm && !wrap){
      wrap = document.createElement("div");
      wrap.id = "authInstallWrap";
      wrap.style.cssText = "margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)";
      wrap.innerHTML = `
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button type="button" class="btn" data-desktop-shortcut="1" style="flex:1 1 170px;display:inline-flex;align-items:center;justify-content:center;gap:6px;margin:0;font-weight:600">${SHORTCUT_ICON_SVG} Raccourci Bureau</button>
          <button type="button" class="btn s" data-export-app-html="1" style="flex:1 1 170px;display:inline-flex;align-items:center;justify-content:center;gap:6px;margin:0;font-weight:600">${APP_DL_ICON_SVG} Télécharger .html</button>
        </div>
        <div id="authInstallMsg" class="mu" style="margin-top:6px;font-size:12px"></div>
      `;
      loginForm.insertAdjacentElement("afterend", wrap);
    }

    if(wrap){
      wrap.style.display = isLoggedIn ? "none" : "block";
    }

    refreshShortcutButtons();
  }

  document.addEventListener("click", function(e){
    const scBtn = e.target.closest("[data-desktop-shortcut]");
    if(scBtn){
      e.preventDefault();
      forceInstallOrDesktopShortcut();
      return;
    }
    const dlBtn = e.target.closest("[data-export-app-html]");
    if(dlBtn){
      e.preventDefault();
      exportCleanAppHtml();
      setShortcutStatus("✅ Fichier autonome « Ma_Classe_Application-v9.html » téléchargé.");
    }
  });

  const prevRender = window.render;
  if(typeof prevRender === "function"){
    window.render = function(){
      prevRender.apply(this, arguments);
      mountShortcutControls();
    };
  }

  const prevSync = window.syncAuthUI;
  if(typeof prevSync === "function"){
    window.syncAuthUI = function(){
      prevSync.apply(this, arguments);
      mountShortcutControls();
    };
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", mountShortcutControls);
  }else{
    mountShortcutControls();
  }
})();
</script>
</body></html>
